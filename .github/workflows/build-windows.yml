name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Verify lazy startup imports
        shell: pwsh
        run: |
          python -c "import sys; import ai_office_vietnam.ui.main_window; blocked={'google.genai','fitz','docx','PIL','keyring'}; loaded=sorted(name for name in blocked if name in sys.modules); assert not loaded, f'Heavy modules loaded at startup: {loaded}'"

      - name: Build fast portable application
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name "Doi-PDF-sang-Word-Bang-Son" `
            --collect-all keyring `
            --collect-all google.genai `
            --collect-all PIL `
            --hidden-import keyring.backends.Windows `
            --hidden-import fitz `
            ai_office_vietnam/main.py

      - name: Create portable ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Doi-PDF-sang-Word-Bang-Son" -DestinationPath "dist/Doi-PDF-sang-Word-Bang-Son-Portable.zip" -Force
          $hash = (Get-FileHash "dist/Doi-PDF-sang-Word-Bang-Son/Doi-PDF-sang-Word-Bang-Son.exe" -Algorithm SHA256).Hash
          "$hash  Doi-PDF-sang-Word-Bang-Son.exe" | Out-File -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "build\installer.iss"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Doi-PDF-sang-Word-Bang-Son-Fast-Windows
          path: |
            dist/Doi-PDF-sang-Word-Bang-Son-Portable.zip
            dist/SHA256SUMS.txt
            dist-installer/Setup-Doi-PDF-sang-Word-Bang-Son.exe
          if-no-files-found: error
          retention-days: 30
