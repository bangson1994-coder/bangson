name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "AI-Office-Viet-Nam" `
            --collect-all keyring `
            --collect-all google.genai `
            --hidden-import keyring.backends.Windows `
            --hidden-import fitz `
            ai_office_vietnam/main.py

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AI-Office-Viet-Nam.exe -Algorithm SHA256).Hash
          "$hash  AI-Office-Viet-Nam.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Office-Viet-Nam-Windows
          path: |
            dist/AI-Office-Viet-Nam.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
